  <script type="text/javascript">
    var player;
    var playersPlayingTmp = [];
    var isInitialized = false;
    var isPaused = false;

    function loadTour() {
      if (player)
        return;

      var beginFunc = function (event) {
        if (event.name == 'begin') {
          var camera = event.data.source.get('camera');
          if (camera && camera.get('initialSequence') && camera.get('initialSequence').get('movements').length > 0)
            return;
        }

        if (event.sourceClassName == "MediaAudio")
          return;

        isInitialized = true;

        player.unbind('preloadMediaShow', beginFunc, player, true);
        player.unbindOnObjectsOf('PanoramaPlayListItem', 'begin', beginFunc, player, true);
        player.unbind('stateChange', beginFunc, player, true);
        window.parent.postMessage("tourLoaded", '*');

        disposePreloader();

        onVirtualTourLoaded();
      };

      var settings = new TDV.PlayerSettings();

      settings.set(TDV.PlayerSettings.CONTAINER, document.getElementById('viewer'));
      settings.set(TDV.PlayerSettings.SCRIPT_URL, 'script.js?v=1775995660279');
      settings.set(TDV.PlayerSettings.WEBVR_POLYFILL_URL, 'lib/WebVRPolyfill.js?v=1775995660279');
      settings.set(TDV.PlayerSettings.HLS_URL, 'lib/Hls.js?v=1775995660279');
      settings.set(TDV.PlayerSettings.QUERY_STRING_PARAMETERS, 'v=1775995660279');
      window.tdvplayer = player = TDV.PlayerAPI.create(settings);
      player.bind('preloadMediaShow', beginFunc, player, true);
      player.bind('stateChange', beginFunc, player, true);
      player.bindOnObjectsOf('PanoramaPlayListItem', 'begin', beginFunc, player, true);
      player.bindOnObject('rootPlayer', 'start', function (e) {
        var queryDict = {}; location.search.substr(1).split("&").forEach(function (item) { var k = item.split("=")[0], v = decodeURIComponent(item.split("=")[1]); queryDict[k] = v });
        var item = undefined;
        if ("media-index" in queryDict) {
          item = setMediaByIndex(parseInt(queryDict["media-index"]) - 1);
        }
        else if ("media-name" in queryDict) {
          item = setMediaByName(queryDict["media-name"]);
        }
        else {
          item = setMediaByIndex(0);
        }
        if (item != undefined && "trigger-overlay-name" in queryDict) {
          triggerOverlayByName(item, queryDict["trigger-overlay-name"], "trigger-overlay-event" in queryDict ? queryDict["trigger-overlay-event"] : "click");
        }

        player.getById('rootPlayer').bind('tourEnded', function () {
          onVirtualTourEnded();
        }, player, true);
      }, player, false);

      // ── MENDETEKSI PERPINDAHAN PANORAMA DENGAN INTERVAL (Lebih Stabil) ──
      var currentMediaId = null;
      setInterval(function() {
        if (!player) return;
        var rootPlayer = player.getById('rootPlayer');
        if (!rootPlayer) return;
        var mainMediaItem = rootPlayer.get('mainMedia'); // Ini adalah PlayListItem
        if (!mainMediaItem) return;
        
        var media = mainMediaItem.get('media'); // Ini baru object Panorama-nya
        if (!media) return;
        
        var mediaId = media.get('id') || media.get('name');
        if (mediaId && mediaId !== currentMediaId) {
          currentMediaId = mediaId;
          if (window.vftOnPanoChange) {
            var rawName = media.get('label') || media.get('name');
            var panoName = rawName ? rawName.replace(/\(\*\)/g, '').trim() : 'lokasi baru';
            window.vftOnPanoChange(panoName);
          }
        }
      }, 1000);

      /* Listen messages */
      window.addEventListener('message', function (e) {
        //Listen to messages for make actions to player in the format function:param1,param2
        var action = e.data;
        if (action == 'pauseTour' || action == 'resumeTour') {
          this[action].apply(this);
        }
      });
    }

    function pauseTour() {
      isPaused = true;
      if (!isInitialized)
        return;

      var playLists = player.getByClassName('PlayList');
      for (var i = 0, count = playLists.length; i < count; i++) {
        var playList = playLists[i];
        var index = playList.get('selectedIndex');
        if (index != -1) {
          var item = playList.get('items')[index];
          var itemPlayer = item.get('player');
          if (itemPlayer && itemPlayer.pause) {
            playersPlayingTmp.push(itemPlayer);
            itemPlayer.pause();
          }
        }
      }

      player.getById('pauseGlobalAudios')();
    }

    function resumeTour() {
      isPaused = false;
      if (!isInitialized)
        return;

      while (playersPlayingTmp.length) {
        var viewer = playersPlayingTmp.pop();
        viewer.play();
      }

      player.getById('resumeGlobalAudios')();
    }

    function onVirtualTourLoaded() {
      if (isPaused)
        pauseTour();
    }

    function onVirtualTourEnded() {

    }

    function getRootPlayer() {
      return window.tdvplayer !== undefined ? window.tdvplayer.getById('rootPlayer') : undefined;
    }

    function setMediaByIndex(index) {
      var rootPlayer = getRootPlayer();
      if (rootPlayer !== undefined) {
        return rootPlayer.setMainMediaByIndex(index);
      }
    }

    function setMediaByName(name) {
      var rootPlayer = getRootPlayer();
      if (rootPlayer !== undefined) {
        return rootPlayer.setMainMediaByName(name);
      }
    }

    function triggerOverlayByName(item, name, eventName) {
      var rootPlayer = getRootPlayer();
      if (rootPlayer !== undefined) {
        item.bind('begin', function (e) {
          item.unbind('begin', arguments.callee, this);
          var overlay = rootPlayer.getPanoramaOverlayByName(item.get('media'), name);
          if (overlay)
            rootPlayer.triggerOverlay(overlay, eventName);
        }, rootPlayer);
      }
    }

    function showPreloader() {
      var preloadContainer = document.getElementById('preloadContainer');
      if (preloadContainer != undefined)
        preloadContainer.style.opacity = 1;
    }

    function disposePreloader() {
      var preloadContainer = document.getElementById('preloadContainer');
      if (preloadContainer == undefined)
        return;

      var transitionEndName = transitionEndEventName();
      if (transitionEndName) {
        preloadContainer.addEventListener(transitionEndName, hide, false);
        preloadContainer.style.opacity = 0;
        setTimeout(hide, 500); //Force hide. Some cases the transitionend event isn't dispatched with an iFrame.
      }
      else {
        hide();
      }

      function hide() {

        preloadContainer.style.visibility = 'hidden';
        preloadContainer.style.display = 'none';
      }

      function transitionEndEventName() {
        var el = document.createElement('div');
        var transitions = {
          'transition': 'transitionend',
          'OTransition': 'otransitionend',
          'MozTransition': 'transitionend',
          'WebkitTransition': 'webkitTransitionEnd'
        };

        var t;
        for (t in transitions) {
          if (el.style[t] !== undefined) {
            return transitions[t];
          }
        }

        return undefined;
      }
    }

    function onBodyClick() {
      document.body.removeEventListener("click", onBodyClick);
      document.body.removeEventListener("touchend", onBodyClick);
      loadTour();
    }

    function onLoad() {
      if (/AppleWebKit/.test(navigator.userAgent) && /Mobile\/\w+/.test(navigator.userAgent)) {
        var inIFrame = false;
        try {
          inIFrame = (window.self !== window.top);
        }
        catch (e) {
          inIFrame = true;
        }
        if (!inIFrame) {
          var onResize = function (async) {
            [0, 250, 1000, 2000].forEach(function (delay) {
              setTimeout(function () {
                var viewer = document.querySelector('#viewer');
                var scale = window.innerWidth / document.documentElement.clientWidth;
                var width = document.documentElement.clientWidth;
                var height = Math.round(window.innerHeight / scale);
                viewer.style.width = width + 'px';
                viewer.style.height = height + 'px';
                viewer.style.left = Math.round((window.innerWidth - width) * 0.5) + 'px';
                viewer.style.top = Math.round((window.innerHeight - height) * 0.5) + 'px';
                viewer.style.transform = 'scale(' + scale + ', ' + scale + ')';
                window.scrollTo(0, 0);
              }, delay);
            });
          };
          window.addEventListener('resize', onResize);
          onResize();
        }
      }


      if (isOVRWeb()) {
        showPreloader();
        loadTour();
        return;
      }

      showPreloader();
      loadTour()
    }

    function playVideo(video) {
      function isSafariDesktopV11orGreater() {
        return /^((?!chrome|android|crios|ipad|iphone).)*safari/i.test(navigator.userAgent) && parseFloat(/Version\/([0-9]+\.[0-9]+)/i.exec(navigator.userAgent)[1]) >= 11;
      }

      function detectUserAction() {
        var onVideoClick = function (e) {
          if (video.paused) {
            video.play();
          }
          video.muted = false;
          e.stopPropagation();
          e.stopImmediatePropagation();
          e.preventDefault();
          video.removeEventListener('click', onVideoClick);
          video.removeEventListener('touchend', onVideoClick);
        };
        video.addEventListener("click", onVideoClick);
        video.addEventListener("touchend", onVideoClick);
      }

      if (isSafariDesktopV11orGreater()) {
        video.muted = true;
        video.play();
      } else {
        var canPlay = true;
        var promise = video.play();
        if (promise) {
          promise.catch(function () {
            video.muted = true;
            video.play();
            detectUserAction();
          });
        } else {
          canPlay = false;
        }

        if (!canPlay || video.muted) {
          detectUserAction();
        }
      }
    }

    function isOVRWeb() {
      return window.location.hash.substring(1).split('&').indexOf('ovrweb') > -1;
    }

  <script>
    (function () {

      /* ════════════════════════════════════════
         ⚙️  KONFIGURASI — EDIT BAGIAN INI
      ════════════════════════════════════════ */
      var CFG = {
        k1a: 'AIzaSyAm', k1b: 'cRRX7Egb', k1c: 'bGEQ9tD1JiWFXsrb0nn_X2E',
        k2a: 'AIzaSyBj', k2b: '9AMqKXAw', k2c: 'atQ_1o9gkRZGBkPNxVjK0Qg',
        k3a: 'AIzaSyBK', k3b: 'uahhCHMy', k3c: 'n2TZ7zyZXs67j1FGyi3UMVQ',
        k4a: 'AIzaSyCC', k4b: 'FPMFZ3po', k4c: 'pxpiFn5ieHVjQhuo0oj36TU',
        k5a: '', k5b: '', k5c: '',

        namaLokasi: 'Clungup Mangrove Conservation',
        namaPemandu: 'Pak Wisnu',
        bahasa: 'id-ID',
        maxHistory: 10,
        autoCapture: false,
      };
      /* ════════════════════════════════════════ */

      var SYSTEM = 'Kamu adalah ' + CFG.namaPemandu + ', pemandu Virtual Field Trip yang sedang berlangsung di ' + CFG.namaLokasi + '.'
        + ' Tugasmu memandu siswa/pengunjung dengan cara yang ramah, menarik, dan berbobot akademis tinggi, Jawablah dalam bahasa Indonesia disertai dengan rujukannya. Format teks Anda dengan Markdown dasar (seperti **tebal** untuk penekanan) agar mudah dibaca.'
        + ' PENTING: Selalu kaitkan penjelasanmu dengan teori lingkungan hidup seperti Carrying Capacity (Daya Dukung), Ecological Footprint (Jejak Ekologis), Blue Carbon, Pendekatan Keruangan/Ekologis, dan Community Based Conservation, dan sebagainya yang relevan dengan pertanyaan.'
        + ' Gunakan bahasa Indonesia yang edukatif namun tetap asyik. Jawaban idealnya 3-7 kalimat, sesekali pakai emoji relevan.'
        + ' Jika menerima gambar, identifikasi semua objek yang terlihat, jelaskan nama, fungsi, fakta menarik, dan nilai edukasinya secara saintifik.'
        + ' JIKA PENGGUNA MEMINTA KUIS ATAU UJIAN: Kamu WAJIB menyisipkan data kuis dalam format JSON yang diapit oleh tag <KUIS> dan </KUIS>. JSON harus memiliki properti: "pertanyaan" (string), "opsi" (array of 3 string), "jawaban_benar" (integer index 0-2), dan "penjelasan" (string kenapa benar). Contoh: <KUIS>{"pertanyaan": "Berapa...", "opsi": ["Satu", "Dua", "Tiga"], "jawaban_benar": 1, "penjelasan": "Karena..."}</KUIS>. Kamu boleh memberi kata pengantar sebelum tag <KUIS>.'
        + ' JIKA PENGGUNA MEMINTA JURNAL RANGKUMAN: Rangkum seluruh poin materi akademik yang telah diobrolkan dari awal, beri tingkat penilaian keaktifan penggunanya, dan motivasi manis. PENTING: Di akhir respon jurnalmu WAJIB tambahkan persis kata ini: [JURNAL_SELESAI]';

      var msgs = [], loading = false, chatOpen = false;
      var recognition = null, isListening = false;
      window.kuisUser = 0;

      var _keyIndex = 0;
      var _keyCooldown = {};

      function _getActiveKeys() {
        var raw = [
          CFG.k1a + CFG.k1b + CFG.k1c,
          CFG.k2a + CFG.k2b + CFG.k2c,
          CFG.k3a + CFG.k3b + CFG.k3c,
          CFG.k4a + CFG.k4b + CFG.k4c,
          CFG.k5a + CFG.k5b + CFG.k5c,
        ];
        return raw.filter(function (k) { return k && k.length > 20; });
      }

      function _updateKeyIndicator(idx, total) {
        var el = document.getElementById('vft-key-status');
        if (el) {
          el.textContent = '🔑 Key ' + (idx + 1) + '/' + total;
          el.style.display = '';
        }
      }

      function saveChatState() {
        try {
          localStorage.setItem('vft_msgs', JSON.stringify(msgs));
          localStorage.setItem('vft_kuis', window.kuisUser);
        } catch (e) { }
      }
      function loadChatState() {
        try {
          var savedMsgs = localStorage.getItem('vft_msgs');
          var savedKuis = localStorage.getItem('vft_kuis');
          if (savedKuis) window.kuisUser = parseInt(savedKuis) || 0;
          if (savedMsgs) {
            var parsed = JSON.parse(savedMsgs);
            if (Array.isArray(parsed) && parsed.length > 0) {
              msgs = parsed;
              msgs.forEach(function (m) {
                if (m.content && !m.content.includes('(siswa meminta analisis visual')) {
                  var r = (m.role === 'model' || m.role === 'assistant') ? 'b' : 'u';
                  addMsg(r, m.content);
                }
              });
            }
          }
        } catch (e) { }
      }

      window.vftToggle = function () {
        chatOpen = !chatOpen;
        document.getElementById('vft-win').className = chatOpen ? 'open' : 'closed';
        var badge = document.getElementById('vft-badge');
        if (chatOpen) {
          badge.style.display = 'none';
          badge.innerText = '0';
          setTimeout(function () { document.getElementById('vft-inp').focus(); }, 300);
        }
      };

      window.vftChip = function (text) {
        document.getElementById('vft-inp').value = text;
        vftSend();
      };

      window.vftSend = async function () {
        if (loading) return;
        var inp = document.getElementById('vft-inp');
        var text = inp.value.trim();
        if (!text) return;
        inp.value = '';
        addMsg('u', text);
        msgs.push({ role: 'user', content: text });
        saveChatState();
        await runAPI();
      };

      window.vftStartScan = function () {
        if (CFG.autoCapture) {
          var canvas = document.querySelector('#viewer canvas');
          if (canvas) {
            try {
              var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
              var b64 = dataUrl.split(',')[1];
              if (b64 && b64.length > 100) {
                processImage(b64, 'image/jpeg', dataUrl);
                return;
              }
            } catch (e) {}
          }
        }
        document.getElementById('vft-file').click();
      };

      window.vftHandleFile = function (e) {
        var file = e.target.files[0];
        if (!file) return;

        var img = new Image();
        img.onload = function () {
          var canvas = document.createElement('canvas');
          var MAX_SIZE = 1024;
          var scale = Math.min(MAX_SIZE / img.width, MAX_SIZE / img.height, 1);

          canvas.width = img.width * scale;
          canvas.height = img.height * scale;

          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          var compressedData = canvas.toDataURL('image/jpeg', 0.75);
          var b64 = compressedData.split(',')[1];

          processImage(b64, 'image/jpeg', compressedData);
        };
        img.src = URL.createObjectURL(file);
        e.target.value = '';
      };

      function processImage(b64, mediaType, previewSrc) {
        hideChips();
        addMsg('u', '📷 <em>Menganalisis objek dalam pandangan 360°...</em>', previewSrc);
        msgs.push({ role: 'user', content: '(siswa meminta analisis visual dari pandangan saat ini)' });

        setScanStatus(true);
        loading = true;
        setSendDisabled(true);

        var typingEl = addTyping();

        callAPI(null, b64, mediaType).then(function (reply) {
          typingEl.remove();
          addMsg('b', reply);
          msgs.push({ role: 'assistant', content: reply });
          saveChatState();
        }).catch(function (e) {
          typingEl.remove();
          console.error(e);
          addMsg('b', 'Maaf, gagal menganalisis gambar. Coba lagi ya! 🙏');
          msgs.pop();
        }).finally(function () {
          setScanStatus(false);
          loading = false;
          setSendDisabled(false);
        });
      }

      async function runAPI() {
        loading = true;
        setSendDisabled(true);
        var typingEl = addTyping();
        try {
          var reply = await callAPI(msgs);
          typingEl.remove();
          
          if (reply.includes('[JURNAL_SELESAI]')) {
            reply = reply.replace('[JURNAL_SELESAI]', '');
            reply += '<br><br><button onclick="window.downloadJurnalPDF(this.parentNode)" style="background:#2a9d8f;color:white;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:bold;width:100%;font-size:13px;box-shadow:0 3px 6px rgba(0,0,0,0.1);">&#11015; Download PDF Jurnal</button>';
          }

          var kuisHtml = '';
          var jsonStr = null;
          
          var kuisMatch = reply.match(/<KUIS>([\s\S]*?)<\/KUIS>/);
          if (kuisMatch) {
            jsonStr = kuisMatch[1];
            reply = reply.replace(kuisMatch[0], '').trim();
          } else {
            var jsonMatch = reply.match(/```(?:json)?\s*(\{[\s\S]*?"jawaban_benar"[\s\S]*?\})\s*```/);
            if (jsonMatch) {
              jsonStr = jsonMatch[1];
              reply = reply.replace(jsonMatch[0], '').trim();
            } else {
              var rawMatch = reply.match(/(\{[\s\S]*?"jawaban_benar"[\s\S]*?\})/);
              if (rawMatch) {
                jsonStr = rawMatch[1];
                reply = reply.replace(rawMatch[0], '').trim();
              }
            }
          }

          if (jsonStr) {
            jsonStr = jsonStr.replace(/```(?:json)?/g, '').replace(/```/g, '').trim();
            try {
              var kuisData = JSON.parse(jsonStr);
              var qId = 'kuis_' + Date.now();
              window['data_' + qId] = kuisData;
              kuisHtml = '<div class="vft-quiz-container" id="' + qId + '">';
              kuisHtml += '<div class="vft-quiz-q">' + kuisData.pertanyaan + '</div>';
              kuisData.opsi.forEach(function(opt, idx) {
                var btnHtml = '<button class="vft-quiz-btn" onclick="window.jawabKuis(\'' + qId + '\', ' + idx + ')">';
                btnHtml += String.fromCharCode(65 + idx) + '. ' + opt + '</button>';
                kuisHtml += btnHtml;
              });
              kuisHtml += '<div class="vft-quiz-expl" id="expl_' + qId + '" style="display:none"></div>';
              kuisHtml += '</div>';
            } catch (e) {
              console.error("Gagal parse KUIS", e);
            }
          }

          if (kuisHtml) {
            reply += (reply.length > 0 ? '<br>' : '') + kuisHtml;
          }
          
          addMsg('b', reply);
          msgs.push({ role: 'assistant', content: reply });
          saveChatState();
        } catch (e) {
          typingEl.remove();
          console.error(e);
          addMsg('b', 'Maaf, API Error: ' + (e.message || e));
          msgs.pop();
        }
        loading = false;
        setSendDisabled(false);
      }

      async function callAPI(history, imgB64, imgType) {
        var activeKeys = _getActiveKeys();
        if (activeKeys.length === 0) {
          throw new Error('Tidak ada API Key yang valid. Periksa konfigurasi CFG.apiKeys.');
        }

        if (_keyIndex >= activeKeys.length) _keyIndex = 0;

        var recent = (history || msgs).slice(-CFG.maxHistory);
        var apiMsgs = [];
        for (var i = 0; i < recent.length; i++) {
          if (imgB64 && i === recent.length - 1) continue;
          apiMsgs.push({
            role: recent[i].role === 'assistant' ? 'model' : 'user',
            parts: [{ text: recent[i].content }]
          });
        }
        if (imgB64) {
          apiMsgs.push({
            role: 'user',
            parts: [
              { inlineData: { mimeType: imgType || 'image/jpeg', data: imgB64 } },
              { text: 'Tolong identifikasi dan jelaskan semua objek menarik yang terlihat dalam gambar ini dari sudut pandang edukatif! Sebutkan nama objek, fungsinya, fakta menarik, dan nilai belajarnya.' }
            ]
          });
        }
        var payload = {
          systemInstruction: { parts: [{ text: SYSTEM }] },
          contents: apiMsgs,
          generationConfig: { maxOutputTokens: 2500 }
        };

        var startIdx = _keyIndex;
        for (var attempt = 0; attempt < activeKeys.length; attempt++) {
          var tryIdx = (startIdx + attempt) % activeKeys.length;

          var cd = _keyCooldown[tryIdx];
          if (cd && Date.now() < cd) {
            continue;
          }

          if (attempt > 0) {
            await new Promise(function (r) { setTimeout(r, 600); });
          }

          _updateKeyIndicator(tryIdx, activeKeys.length);
          var url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=' + activeKeys[tryIdx];

          try {
            var resp = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            var data = await resp.json();

            if (resp.status === 429 || (data.error && data.error.code === 429)) {
              _keyCooldown[tryIdx] = Date.now() + 65000;
              _keyIndex = (tryIdx + 1) % activeKeys.length;
              continue;
            }

            if (resp.status === 400 || resp.status === 404) {
              throw new Error((data.error && data.error.message) || 'Error ' + resp.status);
            }

            if (data.error) throw new Error(data.error.message);

            _keyIndex = tryIdx;

            if (!data.candidates || data.candidates.length === 0) {
              if (data.promptFeedback && data.promptFeedback.blockReason) {
                return 'Maaf, pesan diblokir oleh sistem keamanan. Coba pertanyaan lain.';
              }
              return 'Maaf, tidak ada respon dari AI.';
            }
            var candidate = data.candidates[0];
            if (candidate.finishReason !== 'STOP' && !candidate.content) {
              return 'Maaf, respon dihentikan otomatis (Alasan: ' + candidate.finishReason + ').';
            }
            return candidate.content.parts[0].text;

          } catch (fetchErr) {
            throw fetchErr;
          }
        }
        throw new Error('⚠️ Semua API Key sedang di-cooldown.');
      }

      window.vftToggleMic = function () {
        var supported = 'SpeechRecognition' in window || 'webkitSpeechRecognition' in window;
        if (!supported) {
          addMsg('b', 'Browser ini belum mendukung mikrofon otomatis. Gunakan Chrome/Edge ya! 😊');
          return;
        }
        if (!recognition) {
          var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          recognition = new SR();
          recognition.lang = CFG.bahasa;
          recognition.continuous = false;
          recognition.interimResults = true;
          recognition.onresult = function (e) {
            var transcript = Array.from(e.results).map(function (r) { return r[0].transcript; }).join('');
            document.getElementById('vft-inp').value = transcript;
            if (e.results[e.results.length - 1].isFinal) {
              stopMic();
              vftSend();
            }
          };
          recognition.onerror = stopMic;
          recognition.onend = stopMic;
        }
        isListening ? stopMic() : startMic();
      };

      function startMic() {
        isListening = true;
        try { recognition.start(); } catch (e) { }
        document.getElementById('vft-mic').classList.add('active');
        document.getElementById('vft-inp').placeholder = '🎤 Bicara sekarang...';
      }

      function stopMic() {
        isListening = false;
        try { recognition.stop(); } catch (e) { }
        document.getElementById('vft-mic').classList.remove('active');
        document.getElementById('vft-inp').placeholder = 'Tanya Pak Wisnu...';
      }

      window.jawabKuis = function(qId, selectedIdx) {
        var data = window['data_' + qId];
        var container = document.getElementById(qId);
        if (!container || !data) return;
        
        var btns = container.querySelectorAll('.vft-quiz-btn');
        btns.forEach(function(b, idx) {
          b.disabled = true;
          if (idx === data.jawaban_benar) {
            b.classList.add('correct');
          } else if (idx === selectedIdx) {
            b.classList.add('wrong');
          }
        });
        
        var expl = document.getElementById('expl_' + qId);
        expl.style.display = 'block';
        
        var isCorrect = selectedIdx === data.jawaban_benar;
        expl.innerHTML = (isCorrect ? '🎉 <b>Benar!</b> ' : '❌ <b>Kurang tepat.</b> ') + data.penjelasan;
        
        if (isCorrect) {
          window.kuisUser++;
          if (window.kuisUser >= 2) {
            expl.innerHTML += '<br><div style="background:#d8f3dc;border:1px solid #b7e4c7;padding:12px;border-radius:8px;text-align:center;margin-top:10px;">🎉 <b>Hebat! Kamu telah menuntaskan 2 Kuis!</b><button onclick="window.laporWA()" class="vft-quiz-wa-btn">📱 Lapor ke WhatsApp Guru</button></div>';
          } else {
            expl.innerHTML += '<div style="font-size:11px;color:#2a9d8f;margin-top:6px;">✅ <i>Progres Kuis: ' + window.kuisUser + ' / 2 diselesaikan</i></div>';
          }
          saveChatState();
        }
      };

      var typingCounter = 0;

      function addMsg(role, html, imgSrc) {
        var c = document.getElementById('vft-msgs');
        var d = document.createElement('div');
        d.className = 'vft-row ' + role;
        var inner = '';
        if (role === 'b') inner += '<div class="vft-mav">🌿</div>';
        inner += '<div class="vft-bub">';
        if (imgSrc) inner += '<img src="' + imgSrc + '" class="vft-img-prev">';

        var formattedHtml = html
          .replace(/\n/g, '<br>')
          .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
          .replace(/\*(.*?)\*/g, '<i>$1</i>');

        inner += formattedHtml + '</div>';
        d.innerHTML = inner;
        c.appendChild(d);
        if (typeof c.scrollTo === 'function') {
          c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' });
        } else {
          c.scrollTop = c.scrollHeight;
        }
        return d;
      }

      function addTyping() {
        var id = 'vft-typing-' + (++typingCounter);
        var c = document.getElementById('vft-msgs');
        var d = document.createElement('div');
        d.className = 'vft-row b';
        d.id = id;
        d.innerHTML = '<div class="vft-mav">🌿</div><div class="vft-bub"><div class="vft-typing"><span></span><span></span><span></span></div></div>';
        c.appendChild(d);
        if (typeof c.scrollTo === 'function') {
          c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' });
        } else {
          c.scrollTop = c.scrollHeight;
        }
        return d;
      }

      function hideChips() {
        var el = document.getElementById('vft-chips');
        if (el) el.style.display = 'none';
      }

      function setSendDisabled(v) {
        document.getElementById('vft-send').disabled = v;
      }

      function setScanStatus(active) {
        document.getElementById('vft-scan-hint').style.display = active ? 'none' : '';
        document.getElementById('vft-scan-status').style.display = active ? '' : 'none';
      }

      window.laporWA = function () {
        var namaSiswa = prompt("Halo! Ketik Nama Lengkap dan Kelas kamu dulu ya:", "");
        if (!namaSiswa) return;
        var textWA = "Halo Mas Ilham!\n\nSaya *" + namaSiswa + "* baru saja menyelesaikan pembelajaran di Clungup Virtual Conservation.\nSaya telah berhasil merampungkan ke-2 tantangan Kuis Edukasi dari AI Pak Wisnu dengan sukses!\n\nMohon arahan untuk evaluasi tugas selanjutnya.";
        var waURL = "https://wa.me/6288990032374?text=" + encodeURIComponent(textWA);
        window.location.href = waURL;
      };

      window.downloadJurnalPDF = function (bubbleEl) {
        var tmp = bubbleEl.cloneNode(true);
        var btn = tmp.querySelector('button');
        if (btn) btn.parentNode.removeChild(btn);
        var bodyContent = tmp.innerHTML.trim();

        var h = '';
        h += '<!DOCTYPE html><html><head><meta charset=UTF-8>';
        h += '<title>Jurnal Belajar<\/title>';
        h += '<style>';
        h += 'body{font-family:Arial,sans-serif;padding:40px;color:#333;line-height:1.7;max-width:750px;margin:0 auto}';
        h += 'h1{color:#2d6a4f;border-bottom:2px solid #2d6a4f;padding-bottom:10px;font-size:20px}';
        h += 'b{color:#1b4332}';
        h += '.ft{margin-top:50px;font-size:11px;color:#888;border-top:1px solid #ddd;padding-top:10px}';
        h += '<\/style><\/head><body>';
        h += '<h1>Jurnal Belajar Rangkuman Edukasi<\/h1>';
        h += '<div style="background:#f9f9f9;padding:20px;border-radius:8px">';
        h += bodyContent;
        h += '<\/div>';
        h += '<p class=ft>Dicetak: ' + new Date().toLocaleString() + '<\/p>';
        h += '<\/body><\/html>';

        var fr = document.createElement('iframe');
        fr.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;border:none';
        document.body.appendChild(fr);
        fr.contentDocument.open();
        fr.contentDocument.write(h);
        fr.contentDocument.close();
        setTimeout(function () {
          fr.contentWindow.print();
          setTimeout(function () { if (fr.parentNode) fr.parentNode.removeChild(fr); }, 2000);
        }, 500);
      };

      /* ── FITUR CONTEXT-AWARE: DETEKSI LOKASI BARU ── */
      var lastPanoName = "";
      window.vftOnPanoChange = function(panoName) {
        if (!panoName || panoName === lastPanoName) return;
        lastPanoName = panoName;
        
        setTimeout(function() {
           var greetText = "Wah, sepertinya kita sekarang berada di area **" + panoName + "**! Ada yang ingin ditanyakan seputar lokasi ini?";
           
           if (!chatOpen) {
             var badge = document.getElementById('vft-badge');
             var currentCount = parseInt(badge.innerText) || 0;
             badge.innerText = currentCount + 1;
             badge.style.display = '';
           }

           addMsg('b', greetText);
           msgs.push({ role: 'assistant', content: greetText });
           saveChatState();
        }, 1500);
      };

      loadChatState();

    })();
  </script>
